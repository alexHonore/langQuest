# Shared sub-flow: sign in with the given credentials. Parameters: EMAIL, PASSWORD.
# Controls are selected by their stable `testID`s (apps/mobile/src/app/auth/sign-in.tsx, onboarding/welcome.tsx).
appId: org.langquest.app
---
- runFlow:
    when:
      visible:
        id: "onboarding-have-account"
    commands:
      - tapOn:
          id: "onboarding-have-account"
- assertVisible:
    id: "auth-email"
- tapOn:
    id: "auth-email"
- inputText: ${EMAIL}
- tapOn:
    id: "auth-password"
- inputText: ${PASSWORD}
- hideKeyboard
- tapOn:
    id: "auth-continue"
- extendedWaitUntil:
    visible:
      id: "tab-home"
    timeout: 20000
