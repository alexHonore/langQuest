# A03: an enrolled learner adds a second course with a different instruction language; both coexist.
# Requires MAESTRO_EMAIL_ENROLLED / MAESTRO_PASSWORD_ENROLLED (already learning Arabic (Moroccan) from French).
appId: org.langquest.app
env:
  EMAIL: ${MAESTRO_EMAIL_ENROLLED}
  PASSWORD: ${MAESTRO_PASSWORD_ENROLLED}
---
- launchApp:
    clearState: false
- runFlow:
    when:
      visible:
        id: "onboarding-get-started"
    commands:
      - runFlow: _sign-in.yaml
- extendedWaitUntil:
    visible: "Learning Arabic (Moroccan) from French"
    timeout: 20000
- tapOn:
    id: "home-switch-course"
- assertVisible: "Your courses"
- tapOn:
    id: "course-switcher-add"
- assertVisible: "Courses"
- tapOn:
    id: "catalog-search"
- inputText: "Japanese"
- hideKeyboard
- tapOn:
    id: "catalog-track-japanese"
- assertVisible:
    id: "catalog-enroll"
# Instruction language is chosen per course: pick English for Japanese. The editorial status for
# (Japanese, English) is shown before enrolling; no fallback language is applied automatically.
- tapOn:
    id: "catalog-source-en"
- assertVisible:
    id: "catalog-coverage"
- assertVisible: "Learn Japanese from English"
- tapOn:
    id: "catalog-enroll"
- extendedWaitUntil:
    visible: "Learning Japanese from English"
    timeout: 20000
- tapOn:
    id: "home-switch-course"
- assertVisible: "Learning Arabic (Moroccan) from French"
- assertVisible: "Learning Japanese from English"
- tapOn: "Learning Arabic (Moroccan) from French"
- assertVisible: "Learning Arabic (Moroccan) from French"
