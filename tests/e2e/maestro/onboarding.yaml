# A02 / §10.2B screen 1: fresh install → choose UI + instruction language → choose target → confirm → warm-up → Home.
# Requires MAESTRO_EMAIL / MAESTRO_PASSWORD: a learner with NO enrollments on the target stack.
# Controls use the app's `testID`s; copy assertions stay on the English catalog text.
appId: org.langquest.app
env:
  EMAIL: ${MAESTRO_EMAIL}
  PASSWORD: ${MAESTRO_PASSWORD}
---
- clearState
- launchApp
- assertVisible: "Start speaking from day one"
- assertVisible:
    id: "onboarding-get-started"
- assertNotVisible: "Upgrade"
- assertNotVisible: "Premium"
- tapOn:
    id: "onboarding-have-account"
- runFlow: _sign-in.yaml
# A learner without a course is sent to onboarding.
- extendedWaitUntil:
    visible: "Which language should the app use?"
    timeout: 15000
- tapOn:
    id: "onboarding-ui-en"
- assertVisible: "Which language do you want to learn from?"
- tapOn:
    id: "onboarding-source-fr"
- tapOn:
    id: "onboarding-language-continue"
- assertVisible: "What do you want to learn?"
- tapOn:
    id: "onboarding-target-search"
- inputText: "Moroccan"
- hideKeyboard
- tapOn:
    id: "onboarding-target-arabic-moroccan"
- tapOn:
    id: "onboarding-target-continue"
- assertVisible: "Confirm: learn Arabic (Moroccan) from French"
- assertVisible: "Scripts:.*"
- tapOn:
    id: "onboarding-confirm"
- extendedWaitUntil:
    visible: "A quick, low-pressure warm-up"
    timeout: 15000
- tapOn:
    id: "onboarding-warmup-skip"
- extendedWaitUntil:
    visible: "Learning Arabic (Moroccan) from French"
    timeout: 20000
- assertVisible:
    id: "home-switch-course"
- assertVisible:
    id: "tab-missions"
- assertVisible:
    id: "tab-audio"
- assertVisible:
    id: "tab-speak"
- assertVisible:
    id: "tab-progress"
