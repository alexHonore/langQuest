# A02 / §10.2B screen 1: fresh install → choose UI + instruction language → choose target → confirm → warm-up → Home.
# Requires MAESTRO_EMAIL / MAESTRO_PASSWORD: a learner with NO enrollments on the target stack.
appId: org.langquest.app
env:
  EMAIL: ${MAESTRO_EMAIL}
  PASSWORD: ${MAESTRO_PASSWORD}
---
- clearState
- launchApp
- assertVisible: "Start speaking from day one"
- assertVisible: "Get started"
- assertNotVisible: "Upgrade"
- assertNotVisible: "Premium"
- tapOn: "I already have an account"
- runFlow: _sign-in.yaml
# A learner without a course is sent to onboarding.
- extendedWaitUntil:
    visible: "Which language should the app use?"
    timeout: 15000
- tapOn: "English"
- assertVisible: "Which language do you want to learn from?"
- tapOn: "French"
- assertVisible: "What do you want to learn?"
- tapOn: "Search languages and dialects"
- inputText: "Moroccan"
- hideKeyboard
- tapOn:
    text: "Arabic (Moroccan).*"
- assertVisible: "Confirm: learn Arabic (Moroccan) from French"
- assertVisible: "Scripts:.*"
- tapOn: "Confirm"
- extendedWaitUntil:
    visible: "A quick, low-pressure warm-up"
    timeout: 15000
- tapOn: "Skip the warm-up"
- extendedWaitUntil:
    visible: "Learning Arabic (Moroccan) from French"
    timeout: 20000
- assertVisible: "Switch course"
- assertVisible: "Missions"
- assertVisible: "Audio"
- assertVisible: "Speak"
- assertVisible: "Progress"
