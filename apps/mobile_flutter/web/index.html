<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="LangQuest — learn a language by using it. Free for every learner.">
  <meta name="theme-color" content="#0B0913">
  <meta name="color-scheme" content="dark light">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="LangQuest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>LangQuest</title>
  <link rel="manifest" href="manifest.json">

  <!-- Shown until Flutter paints its first frame (flutter_bootstrap.js removes it). -->
  <style>
    html, body { margin: 0; height: 100%; background: #0B0913; }
    #splash {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 20px; color: #F4F1FA; font: 600 18px/1.2 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    #splash img { width: 96px; height: 96px; border-radius: 24px; }
    #splash .bar { width: 112px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.12); overflow: hidden; }
    #splash .bar::after {
      content: ""; display: block; width: 40%; height: 100%; border-radius: 2px; background: #F2A93B;
      animation: splash-load 1.1s ease-in-out infinite;
    }
    @keyframes splash-load { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) { #splash .bar::after { animation: none; width: 100%; opacity: 0.6; } }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true">
    <img src="icons/Icon-192.png" alt="">
    <div>LangQuest</div>
    <div class="bar"></div>
  </div>
  <noscript>LangQuest needs JavaScript to run in a browser.</noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
