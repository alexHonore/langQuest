name: langquest_mobile
description: "LangQuest learner app (Flutter): offline learn path on the shared draft curriculum."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.13.5

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1
  flutter_animate: ^4.5.2
  google_fonts: ^9.0.0
  http: ^1.6.0
  shared_preferences: ^2.5.6
  uuid: ^4.6.0
  intl: ^0.20.3
  lucide_icons_flutter: ^4.0.0
  # On-device speech for the learn path (L1 scene lines, L3 tap-to-hear); no backend voice in this build.
  flutter_tts: ^4.2.3
  supabase_flutter: ^2.18.3
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  uses-material-design: true
  generate: true

  assets:
    # Generated by `pnpm --filter @langquest/scripts export-flutter-content` (never edit by hand).
    - assets/content/
    # Outfit + Inter, bundled so text never waits on (or reports to) a font CDN; google_fonts finds them by name.
    # SIL Open Font License 1.1 (OFL-*.txt), registered with the LicenseRegistry in main().
    - assets/fonts/

  # Noto Sans subsets for the scripts Inter and Outfit lack (tool/subset_fonts.py; OFL-NotoSans*.txt). They hold the
  # characters the bundle uses, so the web engine never downloads fallback fonts, and Japanese gets Japanese forms
  # (lib/core/theme/script_fonts.dart). test/script_fonts_test.dart fails when the bundle needs a missing character.
  fonts:
    - family: LQ Noto Sans JP
      fonts:
        - asset: assets/fonts/scripts/NotoSansJP-Regular.ttf
        - asset: assets/fonts/scripts/NotoSansJP-Bold.ttf
          weight: 700
    - family: LQ Noto Sans SC
      fonts:
        - asset: assets/fonts/scripts/NotoSansSC-Regular.ttf
        - asset: assets/fonts/scripts/NotoSansSC-Bold.ttf
          weight: 700
    - family: LQ Noto Sans TC
      fonts:
        - asset: assets/fonts/scripts/NotoSansTC-Regular.ttf
        - asset: assets/fonts/scripts/NotoSansTC-Bold.ttf
          weight: 700
    - family: LQ Noto Sans KR
      fonts:
        - asset: assets/fonts/scripts/NotoSansKR-Regular.ttf
        - asset: assets/fonts/scripts/NotoSansKR-Bold.ttf
          weight: 700
    - family: LQ Noto Sans Arabic
      fonts:
        - asset: assets/fonts/scripts/NotoSansArabic-Regular.ttf
        - asset: assets/fonts/scripts/NotoSansArabic-Bold.ttf
          weight: 700
    - family: LQ Noto Sans Hebrew
      fonts:
        - asset: assets/fonts/scripts/NotoSansHebrew-Regular.ttf
        - asset: assets/fonts/scripts/NotoSansHebrew-Bold.ttf
          weight: 700
    - family: LQ Noto Sans Devanagari
      fonts:
        - asset: assets/fonts/scripts/NotoSansDevanagari-Regular.ttf
        - asset: assets/fonts/scripts/NotoSansDevanagari-Bold.ttf
          weight: 700
