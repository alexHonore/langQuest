name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · lint · unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from package.json "packageManager" (setting it here too makes the action fail)
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - name: ffmpeg + ffprobe (apps/jobs and packages/media tests)
        run: command -v ffmpeg && command -v ffprobe || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # turbo's default runs up to 10 package suites at once, each with its own vitest worker pool, on a 4-vCPU runner:
      # CPU-bound suites (packages/ui art rendering) then run ~8x slower and hit the 5 s test timeout. Two at a time takes
      # the same wall time here and keeps every test far below it.
      - run: pnpm exec turbo run test --concurrency=2
        env:
          LANGQUEST_LIVE_TESTS: '0'

  database:
    name: Migrations + RLS (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @langquest/db local:start   # same containers as local development
      - run: pnpm supabase db reset --local
      - run: pnpm --filter @langquest/db test
        env:
          LANGQUEST_REQUIRE_LOCAL_STACK: '1'   # a missing stack fails the suites instead of skipping them
      - if: always()
        run: pnpm supabase stop --no-backup

  flutter:
    name: Flutter app (analyze · tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.47.7, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # The content bundle staying in sync with @langquest/curriculum is checked by the scripts tests (verify job).

  web-image:
    name: Flutter web image (docker build · smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      # The root Dockerfile is what the Infra Tayoo hosted app builds: a broken image would only show up there.
      - run: docker build -t langquest-web .
      - name: Serves the app
        run: |
          docker run -d --name web -p 8080:8080 langquest-web
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:8080/ && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q 'flutter_bootstrap.js'
          curl -fsS -o /dev/null http://localhost:8080/main.dart.js
          curl -fsS -o /dev/null http://localhost:8080/assets/assets/content/chapters.json
          curl -fsS http://localhost:8080/sw.js | grep -q "langquest-v1"   # the offline service worker
          test "$(curl -s -o /dev/null -w '%{content_type}' http://localhost:8080/canvaskit/canvaskit.wasm)" = application/wasm
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/missing.js)" = 404
          # No backend variables here: the app's config is empty (offline), and nothing else is published.
          curl -fsS http://localhost:8080/config.json | grep -qx '{"supabaseUrl":"","supabaseAnonKey":"","apiBaseUrl":""}'
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      # The Flutter tests run on the Dart VM; only the compiled web app shows what dart2js does (it once broke
      # recording while every VM test passed). Playwright as pinned in pnpm-lock.yaml.
      - name: Browser smoke (first run, a lesson, record yourself with a fake microphone, display settings)
        run: |
          mkdir -p "$RUNNER_TEMP/smoke" && cp apps/mobile_flutter/tool/web_smoke.cjs "$RUNNER_TEMP/smoke/"
          cd "$RUNNER_TEMP/smoke" && npm init -y > /dev/null && npm install --no-audit --no-fund playwright@1.64.1 > /dev/null
          npx playwright install --with-deps chromium > /dev/null
          node web_smoke.cjs http://localhost:8080/
      - if: always()
        run: docker logs web || true

  security:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Fail if a known secret pattern is committed
        run: |
          ! git grep -nE "(sk-or-v1-[A-Za-z0-9]{20,}|sbp_[a-f0-9]{30,}|AKIA[0-9A-Z]{16}|re_[A-Za-z0-9]{20,})" -- ':!docs/runbooks/provisioning.md' ':!.github/workflows/ci.yml' || (echo "secret-like token found" && exit 1)
