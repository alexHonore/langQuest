name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck · lint · unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from package.json "packageManager" (setting it here too makes the action fail)
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - name: ffmpeg + ffprobe (apps/jobs and packages/media tests)
        run: command -v ffmpeg && command -v ffprobe || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # turbo's default runs up to 10 package suites at once, each with its own vitest worker pool, on a 4-vCPU runner:
      # CPU-bound suites (packages/ui art rendering) then run ~8x slower and hit the 5 s test timeout. Two at a time takes
      # the same wall time here and keeps every test far below it.
      - run: pnpm exec turbo run test --concurrency=2
        env:
          LANGQUEST_LIVE_TESTS: '0'

  database:
    name: Migrations + RLS (local Supabase)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @langquest/db local:start   # same containers as local development
      - run: pnpm supabase db reset --local
      - run: pnpm --filter @langquest/db test
        env:
          LANGQUEST_REQUIRE_LOCAL_STACK: '1'   # a missing stack fails the suites instead of skipping them
      - if: always()
        run: pnpm supabase stop --no-backup

  flutter:
    name: Flutter app (analyze · tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, flutter-version: 3.47.7, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      # The content bundle staying in sync with @langquest/curriculum is checked by the scripts tests (verify job).

  security:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Fail if a known secret pattern is committed
        run: |
          ! git grep -nE "(sk-or-v1-[A-Za-z0-9]{20,}|sbp_[a-f0-9]{30,}|AKIA[0-9A-Z]{16}|re_[A-Za-z0-9]{20,})" -- ':!docs/runbooks/provisioning.md' ':!.github/workflows/ci.yml' || (echo "secret-like token found" && exit 1)
